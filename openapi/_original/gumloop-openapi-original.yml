              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/EvaluationConfig'
              example:
                config:
                  agent_id: "agent_456"
                  enabled: true
                  is_active: true
                  model_name: "anthropic/claude-sonnet-4"
                  frequency: "debounced"
                  language: "auto"
                  include_auto_tags: true
                  interaction_types: []
                  criteria:
                    - id: "crit_1"
                      name: "Accuracy"
                      prompt: "The agent provided factually correct information."
                      type: "other"
                      priority: "needs_attention"
                    - id: "crit_2"
                      name: "Professional Tone"
                      prompt: "The agent maintained a professional tone throughout."
                      type: "voice_tone"
                      priority: "needs_review"
                  tags:
                    - name: "PRICING_INQUIRY"
                      description: "User asked about pricing or billing."
                    - name: "ESCALATION_NEEDED"
                      description: "Issue requires human intervention."
                  data_points:
                    - id: "dp_1"
                      name: "Customer Intent"
                      data_type: "string"
                      description: "Summarize the customer's primary intent in 2-5 words."
                    - id: "dp_2"
                      name: "Confidence Score"
                      data_type: "number"
                      description: "Rate 1-10 how confident the agent appeared."
                  sentiment:
                    enabled: true
                    affects_grade: true
                    description: "Focus on the customer's final message tone."
                  updated_ts: "2026-06-10T09:00:00+00:00"
        '401':
          description: Unauthorized — missing or invalid credentials.
        '403':
          description: Forbidden — insufficient permissions on this agent.
      security:
        - bearerAuth: []
    patch:
      summary: Update evaluation config
      description: |
        Partially update the evaluation configuration for an agent.
        Omitted fields keep their current value. Provided list fields (criteria, tags, data_points) replace that list entirely.

        Requires Pro tier or above.
      operationId: updateEvaluationConfig
      tags:
        - Evaluations
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X PATCH 'https://api.gumloop.com/api/v1/agents/AGENT_ID/evaluation-config' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN' \
              -H 'Content-Type: application/json' \
              -d '{
                "enabled": true,
                "criteria": [
                  {
                    "name": "Accuracy",
                    "prompt": "The agent provided factually correct information.",
                    "type": "other",
                    "priority": "needs_attention"
                  }
                ],
                "data_points": [
                  {
                    "name": "Customer Intent",
                    "data_type": "string",
                    "description": "Summarize the customer primary intent in 2-5 words."
                  }
                ]
              }'
        - lang: python
          label: Python
          source: |
            import requests

            response = requests.patch(
                "https://api.gumloop.com/api/v1/agents/AGENT_ID/evaluation-config",
                headers={
                    "Authorization": "Bearer YOUR_ACCESS_TOKEN",
                    "Content-Type": "application/json"
                },
                json={
                    "enabled": True,
                    "criteria": [
                        {
                            "name": "Accuracy",
                            "prompt": "The agent provided factually correct information.",
                            "type": "other",
                            "priority": "needs_attention"
                        }
                    ]
                }
            )
            config = response.json()["config"]
      parameters:
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
          description: ID of the agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether evaluations are enabled for this agent.
                model_name:
                  type: string
                  description: LLM model to use for evaluation.
                include_auto_tags:
                  type: boolean
                  description: Allow the evaluator to suggest tags beyond your predefined vocabulary.
                criteria:
                  type: array
                  description: Quality criteria to check (replaces existing list). Max 30.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      prompt:
                        type: string
                        description: True/false statement to evaluate.
                      type:
                        type: string
                        enum: [prohibited_action, prohibited_words, voice_tone, other]
                      priority:
                        type: string
                        enum: [needs_review, needs_attention]
                tags:
                  type: array
                  description: Tag vocabulary (replaces existing list). Max 50.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                data_points:
                  type: array
                  description: Data points to extract (replaces existing list). Max 40.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      data_type:
                        type: string
                        enum: [string, boolean, integer, number]
                      description:
                        type: string
                sentiment:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    affects_grade:
                      type: boolean
                    description:
                      type: string
      responses:
        '200':
          description: Updated evaluation configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/EvaluationConfig'
        '400':
          description: Invalid request (e.g. exceeds limits).
        '401':
          description: Unauthorized — missing or invalid credentials.
        '403':
          description: Forbidden — requires Pro tier or insufficient permissions.
      security:
        - bearerAuth: []

components:
  schemas:
    EvaluationResult:
      type: object
      properties:
        evaluation_id:
          type: string
          description: Unique ID of this evaluation.
        interaction_id:
          type: string
          description: ID of the interaction that was evaluated.
        agent_id:
          type: string
          description: ID of the agent.
        created_ts:
          type: string
          format: date-time
          description: When the evaluation was created.
        status:
          type: string
          enum: [completed, failed]
          description: Terminal status of the evaluation.
        grade:
          type: string
          enum: [pass, needs_review, needs_attention]
          description: Overall grade computed from criteria, sentiment, and call outcome.
        call_successful:
          type: string
          enum: [success, failure, unknown]
          description: Whether the agent's call/task was successful.
        sentiment:
          type: string
          nullable: true
          enum: [positive, neutral, negative]
          description: Detected sentiment of the interaction (null if sentiment analysis is disabled).
        summary:
          type: string
          nullable: true
          description: One or two sentence narrative of what happened in the interaction.
        criteria_results:
          type: array
          description: Per-criterion pass/fail results with rationales.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type: string
                enum: [prohibited_action, prohibited_words, voice_tone, other]
              priority:
                type: string
                enum: [needs_review, needs_attention]
              result:
                type: string
                enum: [success, failure, unknown]
              rationale:
                type: string
        data_results:
          type: array
          description: Extracted data point values from the conversation.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              data_type:
                type: string
                enum: [string, boolean, integer, number]
              value:
                description: The extracted value. Type depends on data_type. Null if the evaluator couldn't find the information.
                nullable: true
        applied_tags:
          type: array
          description: Tags applied to this evaluation.
          items:
            type: string
    EvaluationConfig:
      type: object
      properties:
        agent_id:
          type: string
        enabled:
          type: boolean
        is_active:
          type: boolean
        model_name:
          type: string
          nullable: true
        frequency:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        include_auto_tags:
          type: boolean
        interaction_types:
          type: array
          items:
            type: string
        criteria:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              prompt:
                type: string
              type:
                type: string
              priority:
                type: string
        tags:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
        data_points:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              data_type:
                type: string
              description:
                type: string
        sentiment:
          type: object
          nullable: true
          properties:
            enabled:
              type: boolean
            affects_grade:
              type: boolean
            description:
              type: string
        updated_ts:
          type: string
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal API key or an [OAuth 2.0](/api-reference/oauth) access token. Personal API keys also require the `x-auth-key` header with your user ID.
