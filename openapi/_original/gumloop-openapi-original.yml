                        tool_name: "linear_create_issue"
                        status: "unauthenticated"
                        content: null
                        error:
                          code: "auth_required"
                          message: "Connect Linear before using this tool."
                          type: "permission_error"
                          param: "tool_name"
                          details:
                            server_id: "gumloop_linear"
                            tool_name: "linear_create_issue"
                            gumloop_auth_url: "https://www.gumloop.com/oauth/connect/linear"
        '207':
          description: Partial success — at least one call succeeded and at least one failed. Inspect each result's `status` and `error`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
              examples:
                mixed:
                  summary: One success, one needs authentication
                  value:
                    results:
                      - ref: "send-1"
                        server_id: "gumloop_slack"
                        tool_name: "slack_send_message"
                        status: "success"
                        content:
                          - type: "text"
                            text: "Message sent to #general"
                        error: null
                      - ref: "issue-1"
                        server_id: "gumloop_linear"
                        tool_name: "linear_create_issue"
                        status: "unauthenticated"
                        content: null
                        error:
                          code: "auth_required"
                          message: "Connect Linear before using this tool."
                          type: "permission_error"
                          param: "tool_name"
                          details:
                            server_id: "gumloop_linear"
                            tool_name: "linear_create_issue"
                            gumloop_auth_url: "https://www.gumloop.com/oauth/connect/linear"
        '400':
          description: Invalid Gumloop request body, for example fewer than 1 or more than 5 calls.
        '401':
          description: Unauthorized — missing or invalid Gumloop API credentials.
        '403':
          description: Forbidden — the caller lacks permission to use this Gumloop API endpoint or requested team scope.
        '500':
          description: Internal server error.
      security:
        - bearerAuth: []
  /brain/search:
    post:
      summary: Search Company Brain
      description: |
        Run a hybrid (semantic + keyword) search across the knowledge sources indexed in your [Company Brain](/core-concepts/brain) and return the most relevant, ranked snippets with citations.

        Results are scoped to what the authenticated user can see: personal sources, plus any team and organization sources shared with them. Requires the Brain feature, which is available on the Pro and Enterprise plans. Each search consumes Gumloop credits.
      operationId: searchBrain
      tags:
        - Brain
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl 'https://api.gumloop.com/api/v1/brain/search' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN' \
              -H 'Content-Type: application/json' \
              -d '{
                "query": "what is our refund policy?",
                "limit": 8,
                "source_type": ["notion", "google_drive"]
              }'
        - lang: python
          label: Python
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            response = client.brain.search(
                "what is our refund policy?",
                limit=8,
                source_type=["notion", "google_drive"],
            )
            for result in response.results:
                print(result.score, result.source, result.title, result.url)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: The natural-language search query.
                  example: "what is our refund policy?"
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 8
                  description: Maximum number of results to return.
                  example: 8
                source_type:
                  type: array
                  nullable: true
                  minItems: 1
                  description: |
                    Restrict results to specific source types. Omit to search every source you can access. Valid values: `notion`, `google_drive`, `slack`, `github`, `confluence`, `direct_file_uploads`, `gumloop_artifacts`.
                  items:
                    type: string
                    enum:
                      - notion
                      - google_drive
                      - slack
                      - github
                      - confluence
                      - direct_file_uploads
                      - gumloop_artifacts
                  example:
                    - notion
                    - google_drive
      responses:
        '200':
          description: Ranked search results.
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    description: Ranked matches, most relevant first.
                    items:
                      type: object
                      properties:
                        document_id:
                          type: string
                          nullable: true
                          description: Identifier of the matched document.
                        source:
                          type: string
                          nullable: true
                          description: The source type the result came from, for example `notion` or `slack`.
                        title:
                          type: string
                          nullable: true
                          description: Title of the matched document.
                        content:
                          type: string
                          nullable: true
                          description: The matching snippet of text.
                        url:
                          type: string
                          nullable: true
                          description: Link to the document in its original source, when available.
                        score:
                          type: number
                          nullable: true
                          description: Relevance score, normalized to a 0–1 range.
                        updated_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: When the document was last updated in its source.
                        owner_name:
                          type: string
                          nullable: true
                          description: Display name of the document owner, when known.
                        owner_email:
                          type: string
                          nullable: true
                          description: Email of the document owner, when known.
                        parent_title:
                          type: string
                          nullable: true
                          description: Title of the parent item (for example, a channel or folder), when applicable.
                        metadata:
                          type: object
                          description: Additional source-specific metadata.
              examples:
                success:
                  summary: A single ranked result
                  value:
                    results:
                      - document_id: "notion:2f1a9c7e"
                        source: "notion"
                        title: "Refund Policy"
                        content: "Customers may request a full refund within 30 days of purchase..."
                        url: "https://www.notion.so/Refund-Policy-2f1a9c7e"
                        score: 0.87
                        updated_at: "2024-01-15T10:30:00Z"
                        owner_name: "Jordan Lee"
                        owner_email: "jordan@example.com"
                        parent_title: "Policies"
                        metadata: {}
        '400':
          description: Invalid request, for example a missing `query` or an unrecognized `source_type`.
        '401':
          description: Unauthorized — missing or invalid Gumloop API credentials.
        '403':
          description: Forbidden — the caller lacks access to Brain (Pro or Enterprise plan required) or to this endpoint.
        '402':
          description: Credit limit exceeded.
        '500':
          description: Internal server error.
      security:
        - bearerAuth: []
  /skills:
    get:
      summary: List skills
      description: List skills the caller has access to. Filter by team, search by name, or narrow to a specific creator, related MCP server, or agent.
      operationId: listSkills
      tags:
        - Skills
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl 'https://api.gumloop.com/api/v1/skills?team_id=YOUR_TEAM_ID' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN'
        - lang: python
          label: Python
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            response = client.skills.list(team_id="YOUR_TEAM_ID")
            for skill in response.skills:
                print(skill.id, skill.name)
      parameters:
        - in: query
          name: team_id
          required: false
          schema:
            type: string
          description: Scope the listing to a single team. When omitted, returns skills owned by the authenticated user.
        - in: query
          name: search_query
          required: false
          schema:
            type: string
          description: Case-insensitive substring match against the skill name.
        - in: query
          name: sort_order
          required: false
          schema:
            type: string
            enum: [newest, popular, most_used]
            default: newest
          description: Sort order for the returned skills.
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of skills per page. Clamped between 1 and 100.
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Opaque pagination cursor returned in `next_cursor` from a prior page.
        - in: query
          name: creator_user_id
          required: false
          schema:
            type: string
          description: Filter to skills created by this user ID.
        - in: query
          name: related_server_id
          required: false
          schema:
            type: string
          description: Filter to skills that reference this MCP server ID in their metadata.
        - in: query
          name: agent_id
          required: false
          schema:
            type: string
          description: Filter to skills attached to this agent.
        - in: query
