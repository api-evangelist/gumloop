            type: string
          description: ID of the agent whose artifacts to list.
        - in: query
          name: session_id
          required: false
          schema:
            type: string
          description: Filter to artifacts produced within a specific session.
        - in: query
          name: search_query
          required: false
          schema:
            type: string
          description: Case-insensitive substring match against the artifact filename.
        - in: query
          name: sort_order
          required: false
          schema:
            type: string
            default: newest
