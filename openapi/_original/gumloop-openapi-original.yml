        This endpoint edits document fields only. To attach or detach skills, use [`PATCH /agents/{agent_id}/skills`](/api-reference/agents/update-agent-skills); to manage MCP servers, use the [agent MCP server endpoints](/api-reference/agents/attach-agent-mcp-server).
      operationId: updateAgent
      tags:
        - Agents
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X PATCH 'https://api.gumloop.com/api/v1/agents/abc123DEFghiJKL' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN' \
              -H 'Content-Type: application/json' \
              -d '{
                "description": "Researches enterprise accounts and drafts outreach",
                "is_active": true
              }'
        - lang: python
          label: Python
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            response = client.agents.update(
                "abc123DEFghiJKL",
                description="Researches enterprise accounts and drafts outreach",
                is_active=True,
            )
            print(response.agent.description)
      parameters:
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
          description: ID of the agent to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                model_name:
                  type: string
                  nullable: true
                  description: ID of the LLM the agent runs on. Use `GET /models` to discover valid values.
                  example: "anthropic/claude-sonnet-4"
                description:
                  type: string
                  nullable: true
                  example: "Researches enterprise accounts and drafts outreach"
                system_prompt:
                  type: string
                  nullable: true
                tools:
                  type: array
                  nullable: true
                  description: When provided, replaces the agent's tool list.
                  items:
                    type: object
                resources:
                  type: array
                  nullable: true
                  description: When provided, replaces the agent's resource list.
                  items:
                    type: object
                metadata:
                  type: object
                  nullable: true
                is_active:
                  type: boolean
                  nullable: true
                team_id:
                  type: string
                  nullable: true
                  description: When provided, transfers ownership of the agent to this team.
            examples:
              partial:
                summary: Partial update
                value:
                  description: "Researches enterprise accounts and drafts outreach"
                  is_active: true
      responses:
        '200':
          description: The updated agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "abc123DEFghiJKL"
                      name:
                        type: string
                        example: "Sales research agent"
                      description:
                        type: string
                        nullable: true
                        example: "Researches enterprise accounts and drafts outreach"
                      team_id:
                        type: string
                        example: "team_4f8c92ab"
                      is_active:
                        type: boolean
                        example: true
                      tools:
                        type: array
                        description: Tools the agent can call. Secret references are stripped and MCP server URLs are redacted before being returned.
                        items:
                          type: object
                      metadata:
                        type: object
                      model_name:
                        type: string
                        nullable: true
                        example: "anthropic/claude-sonnet-4"
                      system_prompt:
                        type: string
                        nullable: true
                      resources:
                        type: array
                        items:
                          type: object
                      folder_id:
                        type: string
                        nullable: true
                        example: "folder_91ab"
                      type:
                        type: string
                        nullable: true
                        description: Internal agent type discriminator.
                      created_at:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2026-05-15T14:32:00Z"
                      active_trigger_count:
                        type: integer
                        nullable: true
                        description: Number of active triggers on this agent. Populated on list responses; may be `null` here.
                      creator:
                        type: object
                        nullable: true
                        description: User who created the agent. `null` when the creator is not known.
                        properties:
                          id:
                            type: string
                            nullable: true
                          first_name:
                            type: string
                            nullable: true
                          last_name:
                            type: string
                            nullable: true
                          email:
                            type: string
                            nullable: true
                          profile_picture:
                            type: string
                            nullable: true
              examples:
                updated:
                  summary: Updated agent
                  value:
                    agent:
                      id: "abc123DEFghiJKL"
                      name: "Sales research agent"
                      description: "Researches enterprise accounts and drafts outreach"
                      team_id: "team_4f8c92ab"
                      is_active: true
                      tools: []
                      metadata: {}
                      model_name: "anthropic/claude-sonnet-4"
                      system_prompt: "You are a B2B sales research assistant."
                      resources: []
                      folder_id: "folder_91ab"
                      type: null
                      created_at: "2026-05-15T14:32:00Z"
                      active_trigger_count: null
                      creator:
                        id: "user_8c2a1b"
                        first_name: "Ada"
                        last_name: "Lovelace"
                        email: "ada@example.com"
                        profile_picture: null
        '400':
          description: Invalid request body.
        '401':
          description: Unauthorized — missing or invalid API key.
        '403':
          description: Forbidden — the caller does not have permission to update this agent.
        '404':
          description: Agent not found.
        '500':
          description: Internal server error.
      security:
        - bearerAuth: []
  /chat/completions:
    post:
      summary: Create chat completion
      servers:
        - url: 'https://ws.gumloop.com/api/v1'
      description: |
        OpenAI-compatible chat completions endpoint, multiplexed across every model Gumloop supports
        (Anthropic, OpenAI, Google Gemini, OpenRouter routes). Set `stream: true` for Server-Sent Events,
        or omit it for a unary JSON response. Image-generation models (`gpt-image-*`, `gemini-*-image-preview`,
        `dall-e-*`) are dispatched automatically when `modalities` includes `"image"` and yield image
        attachments on `choices[0].message.images`.

        ### Streaming host

        Chat completions live on the streaming host. Send all requests — unary or streaming — to:

        ```
        POST https://ws.gumloop.com/api/v1/chat/completions
        ```

        `api.gumloop.com` does not serve this endpoint; the Python SDK routes there automatically.

        ### Billing

        Each completion charges the caller's credit balance based on token usage (with cache-token semantics per provider) plus a flat 30-credit fee for image-gen calls. Users who configure their own provider API key get a 50% discount.
      operationId: createChatCompletion
      tags:
        - Chat completions
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST 'https://ws.gumloop.com/api/v1/chat/completions' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN' \
              -H 'Content-Type: application/json' \
              -d '{
                "model": "claude-sonnet-4-5",
                "messages": [{"role": "user", "content": "Capital of Canada?"}]
              }'
        - lang: python
          label: Python (unary)
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            result = client.chat.completions.create(
                model="claude-sonnet-4-5",
                messages=[{"role": "user", "content": "Capital of Canada?"}],
            )
            print(result.choices[0].message.content)
        - lang: python
          label: Python (streaming)
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            for chunk in client.chat.completions.create(
                model="claude-sonnet-4-5",
                messages=[{"role": "user", "content": "Write a haiku about Toronto."}],
                stream=True,
            ):
                delta = chunk.choices[0].delta
                if delta.content:
                    print(delta.content, end="", flush=True)
        - lang: python
          label: Python (structured output)
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            result = client.chat.completions.create(
                model="claude-sonnet-4-5",
                messages=[{"role": "user", "content": "Return JSON with the capital of Canada."}],
                response_format={
                    "type": "json_schema",
                    "json_schema": {
                        "name": "answer",
                        "strict": True,
                        "schema": {
                            "type": "object",
                            "properties": {"capital": {"type": "string"}},
                            "required": ["capital"],
                            "additionalProperties": False,
                        },
                    },
                },
            )
            print(result.choices[0].message.content)
        - lang: python
          label: Python (image generation)
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            result = client.chat.completions.create(
                model="gpt-image-1.5",
                messages=[{"role": "user", "content": "A red maple leaf on white"}],
                modalities=["image", "text"],
                image_config={"size": "1024x1024"},
            )
            for image in result.choices[0].message.images:
                print(image.image_url.url[:64], "...")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              properties:
                model:
                  type: string
                  description: Model slug. Use the `id` from `GET /models` or one of Gumloop's preset routes.
                  example: "claude-sonnet-4-5"
                messages:
                  type: array
                  description: Conversation history. Roles `system`, `user`, `assistant`. Multipart `content` (text + image) is supported on the user role.
                  items:
                    type: object
                  example:
                    - role: "user"
                      content: "Capital of Canada?"
                stream:
                  type: boolean
                  default: false
                  description: "When `true`, the response is `text/event-stream` carrying one `chat.completion.chunk` per delta and terminating with `data: [DONE]`. Otherwise a unary JSON `chat.completion` is returned."
                temperature:
                  type: number
                  description: Sampling temperature.
                max_completion_tokens:
                  type: integer
                  description: Cap on completion tokens. Replaces the deprecated `max_tokens` field.
                modalities:
                  type: array
                  items:
                    type: string
                    enum: ["text", "image"]
                  description: Output modalities. Include `"image"` to route to an image-generation model.
                image_config:
                  type: object
                  description: "Image-generation parameters (size, quality, aspect_ratio, background, output_format, partial_images). Optional. Image-generation models accept either `modalities: [\"image\"]` or `image_config` (or both); chat models ignore this field."
                response_format:
                  type: object
                  description: |
                    Constrain the response. `{type: "json_object"}` returns a JSON object; `{type: "json_schema", json_schema: {name, strict, schema}}` returns JSON matching the supplied schema.
                tools:
                  type: array
                  description: "OpenAI-shape tool definitions (`{type: \"function\", function: {name, description, parameters}}`). Pass `tool_choice` to constrain selection."
                tool_choice:
                  oneOf:
                    - type: string
                    - type: object
                  description: Force a specific tool, leave unset for the model to choose, or pass `"none"` to disable tool calls.
                provider:
                  type: object
                  description: OpenRouter provider routing config. Caller fields like `sort` and `order` are honored; ZDR/data_collection policy is server-enforced.
            example:
              model: "claude-sonnet-4-5"
              messages:
                - role: "user"
                  content: "Capital of Canada?"
      responses:
        '200':
          description: |
            Chat completion. When `stream` is `false` (or omitted), the response is the `chat.completion` envelope below. When `stream: true`, the response is `text/event-stream`; each event carries one `chat.completion.chunk` and the terminator is `data: [DONE]`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "chatcmpl-9a3f8c2b14d6e7"
                  object:
                    type: string
                    example: "chat.completion"
                  created:
                    type: integer
                    example: 1747315920
                  model:
                    type: string
                    example: "claude-sonnet-4-5"
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          example: 0
                        finish_reason:
                          type: string
                          enum: [stop, length, tool_calls, content_filter, error]
                          example: "stop"
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                              example: "assistant"
                            content:
                              type: string
                              example: "Ottawa."
                            tool_calls:
                              type: array
                              items:
                                type: object
                            reasoning:
                              type: string
                              description: Reasoning trace (Anthropic thinking blocks, Gemini thoughts, OpenAI o-series).
                            images:
                              type: array
                              description: Image attachments (data URLs). Populated only when an image-gen model produced output.
                              items:
                                type: object
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                        example: 12
                      completion_tokens:
                        type: integer
                        example: 1
                      total_tokens:
                        type: integer
                        example: 13
                      cost:
                        type: number
                        description: OpenRouter-reported USD cost; absent for native providers.
                      is_byok:
                        type: boolean
                        description: True if the caller's own provider key was used.
              examples:
                unary:
                  summary: Unary completion
                  value:
                    id: "chatcmpl-9a3f8c2b14d6e7"
                    object: "chat.completion"
                    created: 1747315920
                    model: "claude-sonnet-4-5"
                    choices:
                      - index: 0
                        finish_reason: "stop"
                        message:
                          role: "assistant"
                          content: "Ottawa."
                    usage:
                      prompt_tokens: 12
                      completion_tokens: 1
                      total_tokens: 13
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream of `chat.completion.chunk` events. Each event is `data: <json>\n\n`; the stream ends with `data: [DONE]\n\n`.
              example: |
                data: {"id":"chatcmpl-1","object":"chat.completion.chunk","created":1747315920,"model":"claude-sonnet-4-5","choices":[{"index":0,"delta":{"role":"assistant","content":"Ott"},"finish_reason":null}]}

                data: {"id":"chatcmpl-1","object":"chat.completion.chunk","created":1747315920,"model":"claude-sonnet-4-5","choices":[{"index":0,"delta":{"content":"awa."},"finish_reason":null}]}

                data: {"id":"chatcmpl-1","object":"chat.completion.chunk","created":1747315920,"model":"claude-sonnet-4-5","choices":[{"index":0,"delta":{},"finish_reason":"stop"}],"usage":{"prompt_tokens":12,"completion_tokens":2,"total_tokens":14}}

                data: [DONE]
        '400':
          description: Invalid request body, unsupported modality combination, or unregistered model slug.
        '401':
          description: Unauthorized — missing or invalid API key.
        '402':
          description: Insufficient credits.
        '404':
          description: User profile not found.
        '501':
          description: Requested capability not supported by the resolved provider.
        '502':
          description: Upstream provider error.
      security:
        - bearerAuth: []
  /models:
    get:
      summary: List models
      description: List the LLMs and preset model chains available to the caller, grouped for display in a model picker.
      operationId: listModels
      tags:
        - Models
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl 'https://api.gumloop.com/api/v1/models?team_id=YOUR_TEAM_ID' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN'
        - lang: python
          label: Python
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            response = client.models.list()
            for group in response.model_groups:
                print(group)
      parameters:
        - in: query
          name: team_id
          required: false
          schema:
            type: string
          description: Scope model availability to a specific team. When omitted, uses the authenticated user's default organization.
      responses:
        '200':
          description: Model groups available to the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_groups:
                    type: array
                    description: Groups of available models. The shape of each group is open and may evolve; treat it as a passthrough payload for the model picker.
                    items:
                      type: object
              examples:
                groups:
                  summary: Model groups
                  value:
                    model_groups:
                      - {}
        '401':
          description: Unauthorized — missing or invalid API key.
        '403':
          description: Forbidden — the caller does not have agent access on the requested team.
        '500':
          description: Internal server error.
      security:
        - bearerAuth: []
  /agents/{agent_id}/skills:
    patch:
      summary: Attach or detach agent skills
      description: |
        Attach and/or detach skills on an agent using deltas. This is **not** a replace-list: skills you don't mention are left untouched.

        - The operation is idempotent. Re-attaching a skill that's already attached (or detaching one that isn't) is reported under `already_attached` / `already_detached` rather than failing.
        - A skill ID may not appear in both `attach` and `detach`.
        - Up to 100 unique skill IDs total (`attach` + `detach`) per request.
        - Attaching requires `INVOKE` permission on the skill. Detaching is permissive so stale attachments can always be removed.
      operationId: updateAgentSkills
      tags:
        - Agents
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X PATCH 'https://api.gumloop.com/api/v1/agents/abc123DEFghiJKL/skills' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN' \
              -H 'Content-Type: application/json' \
              -d '{
                "attach": ["skill_2b9c"],
                "detach": ["skill_7f1a"]
              }'
      parameters:
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
          description: ID of the agent whose skills to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attach:
                  type: array
                  description: Skill IDs to attach. Ignored if already attached.
                  items:
                    type: string
                  default: []
                detach:
                  type: array
                  description: Skill IDs to detach. Ignored if not attached.
                  items:
                    type: string
                  default: []
            examples:
              attachAndDetach:
                summary: Attach one skill and detach another
                value:
                  attach: ["skill_2b9c"]
                  detach: ["skill_7f1a"]
      responses:
        '200':
          description: The resulting skill set plus what this request changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                    example: "abc123DEFghiJKL"
                  skill_ids:
                    type: array
                    description: Full set of skills attached to the agent after this request.
                    items:
                      type: string
                  attached:
                    type: array
                    description: Skills newly attached by this request.
                    items:
                      type: string
                  detached:
                    type: array
                    description: Skills newly detached by this request.
                    items:
                      type: string
                  already_attached:
                    type: array
                    description: Requested attaches that were already attached (no-op).
                    items:
                      type: string
                  already_detached:
                    type: array
                    description: Requested detaches that weren't attached (no-op).
                    items:
                      type: string
              examples:
                updated:
                  summary: One attached, one detached
                  value:
                    agent_id: "abc123DEFghiJKL"
                    skill_ids: ["skill_2b9c"]
                    attached: ["skill_2b9c"]
                    detached: ["skill_7f1a"]
                    already_attached: []
                    already_detached: []
        '400':
          description: Invalid request — e.g. an ID appears in both `attach` and `detach`, more than 100 unique IDs, or a skill to attach doesn't exist or isn't active (offending IDs returned in `error.details.skill_ids`).
        '401':
          description: Unauthorized — missing or invalid API key.
        '403':
          description: Forbidden — the caller lacks update access to the agent, or lacks `INVOKE` permission on a skill being attached (offending IDs in `error.details.skill_ids`).
        '404':
          description: Agent not found.
        '500':
          description: Internal server error.
      security:
        - bearerAuth: []
  /agents/{agent_id}/mcp-servers:
    get:
      summary: List agent MCP servers
      description: |
        List the MCP servers (connectors) attached to an agent. Sensitive fields such as `secret_id` and `mcp_server_url` are scrubbed from the response.
      operationId: listAgentMcpServers
      tags:
        - Agents
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl 'https://api.gumloop.com/api/v1/agents/abc123DEFghiJKL/mcp-servers' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN'
      parameters:
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
          description: ID of the agent.
      responses:
        '200':
          description: The MCP servers attached to the agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                    example: "abc123DEFghiJKL"
                  mcp_servers:
                    type: array
                    description: Attached MCP server tool configs, with secrets and server URLs redacted.
                    items:
                      type: object
        '401':
          description: Unauthorized — missing or invalid API key.
        '403':
          description: Forbidden — the caller does not have read access to this agent's configuration.
        '404':
          description: Agent not found.
        '500':
          description: Internal server error.
      security:
        - bearerAuth: []
  /agents/{agent_id}/mcp-servers/{server_id}:
    put:
      summary: Attach or update an agent MCP server
      description: |
        Attach an MCP server (connector) to an agent, or update its configuration if it's already attached (upsert).

        The `server_id` is validated against the caller's MCP catalog. Catalog identity fields (`type`, `server_id`, `secret_id`, `mcp_server_url`) always come from the catalog and cannot be spoofed via the request body — the body carries only free-form connector configuration (e.g. approval mode, tool restrictions); any identity keys in it are ignored.

        Attach may succeed before OAuth is completed; `auth_status` reflects the catalog's authentication state.
      operationId: attachAgentMcpServer
      tags:
        - Agents
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X PUT 'https://api.gumloop.com/api/v1/agents/abc123DEFghiJKL/mcp-servers/srv_github' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN' \
              -H 'Content-Type: application/json' \
              -d '{}'
      parameters:
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
          description: ID of the agent.
        - in: path
          name: server_id
          required: true
          schema:
            type: string
          description: ID of the MCP server from the caller's catalog.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Free-form connector configuration. Identity keys are catalog-derived and ignored.
            examples:
              empty:
                summary: Attach with default config
                value: {}
      responses:
        '200':
          description: The attached (or updated) MCP server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                    example: "abc123DEFghiJKL"
                  mcp_server:
                    type: object
                    description: The resulting MCP server tool config, with secrets and server URL redacted.
                  created:
                    type: boolean
                    description: '`true` if the server was newly attached; `false` if an existing attachment was updated.'
                    example: true
                  auth_status:
                    type: string
                    nullable: true
                    description: Catalog authentication status for the server (e.g. whether OAuth has been completed).
                    example: "authenticated"
        '401':
          description: Unauthorized — missing or invalid API key.
        '403':
          description: Forbidden — the caller lacks update access to the agent, or the MCP server is restricted for the organization (`mcp_server_restricted`).
        '404':
          description: Agent not found, or the server ID is not in the caller's catalog (`mcp_server_not_found`).
        '409':
          description: The agent has duplicate entries for this server (`ambiguous_mcp_server`); remove them and retry.
        '500':
          description: Internal server error.
      security:
        - bearerAuth: []
    delete:
      summary: Detach an agent MCP server
      description: |
        Detach an MCP server (connector) from an agent. This is idempotent — detaching a server that isn't attached returns `detached: false` rather than an error.
      operationId: detachAgentMcpServer
      tags:
        - Agents
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X DELETE 'https://api.gumloop.com/api/v1/agents/abc123DEFghiJKL/mcp-servers/srv_github' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN'
      parameters:
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
          description: ID of the agent.
        - in: path
          name: server_id
          required: true
          schema:
            type: string
