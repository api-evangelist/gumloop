  /sessions/{session_id}/messages:
    post:
      summary: Send message
      description: |
        Append a user message to an existing session and resume the agent. The session must be in a terminal state (`idle`, `completed`, or `failed`); sending to a session that is `processing` or `queued` returns `409 interaction_not_in_terminal_state`.

        ### Streaming the response

        `api.gumloop.com` only serves the non-streaming response above. To stream agent output as it's produced, send the same request body (with `stream: true`) to the streaming host instead:

        ```
        POST https://ws.gumloop.com/api/v1/sessions/{session_id}/messages
        ```

        The response is `text/event-stream` (Server-Sent Events). With the Python SDK, `client.sessions.stream_message(session_id, input="...")` routes to `ws.gumloop.com` automatically and yields parsed `StreamEvent` objects.

        If you send `stream: true` to `api.gumloop.com` by mistake, the response is a `400` whose body contains the correct streaming host so you can retry against it.
      operationId: sendMessage
      tags:
        - Sessions
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST 'https://api.gumloop.com/api/v1/sessions/sess_xYz789AbCd/messages' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN' \
              -H 'Content-Type: application/json' \
              -d '{"input": "Now write a follow-up email."}'
        - lang: python
          label: Python
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            response = client.sessions.send(
                "sess_xYz789AbCd",
                input="Now write a follow-up email.",
            )
            print(response.session.state)
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
          description: ID of the session to continue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  description: The next user message. Required. Also accepted as `message` for backwards compatibility.
                  example: "Now write a follow-up email."
                stream:
                  type: boolean
                  default: false
                  description: Must be `false` (or omitted) when calling `api.gumloop.com`. Set to `true` only when calling `ws.gumloop.com` (see the streaming section above).
              required:
                - input
      responses:
        '202':
          description: Message was enqueued. `queue_position` is set only when the session was queued behind concurrent runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "sess_xYz789AbCd"
                      agent_id:
                        type: string
                        example: "abc123DEFghiJKL"
                      messages:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              nullable: true
                              example: "msg_g7h8i9"
                            role:
                              type: string
                              nullable: true
                              example: "user"
                            content:
                              type: string
                              nullable: true
                              example: "Now write a follow-up email."
                            created_at:
                              type: string
                              format: date-time
                              nullable: true
                              example: "2026-05-15T14:35:00Z"
                            creator_id:
                              type: string
                              nullable: true
                              example: "user_2b9d71f0"
                            parts:
                              type: array
                              nullable: true
                              items:
                                type: object
                      created_at:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2026-05-15T14:32:00Z"
                      state:
                        type: string
                        nullable: true
                        enum: [processing, completed, failed, queued, idle]
                        example: "processing"
                      agent_name:
                        type: string
                        nullable: true
                        example: "Sales research agent"
                      agent_team_id:
                        type: string
                        nullable: true
                        example: "team_4f8c92ab"
                      agent_creator_user_id:
                        type: string
                        nullable: true
                        example: "user_2b9d71f0"
                      agent_icon_url:
                        type: string
                        nullable: true
                        example: null
                      agent_tools:
                        type: array
                        description: Tools available to the agent. Secret references are stripped before being returned.
                        items:
                          type: object
                      participants:
                        type: object
                        description: Map of participant user IDs to participant metadata.
                      creator:
                        type: object
                        nullable: true
                        description: Creator of the session. `null` when no creator is recorded.
                        properties:
                          id:
                            type: string
                            nullable: true
                          first_name:
                            type: string
                            nullable: true
                          last_name:
                            type: string
                            nullable: true
                          email:
                            type: string
                            nullable: true
                          profile_picture:
                            type: string
                            nullable: true
                  queue_position:
                    type: integer
                    nullable: true
                    description: Position in the per-agent queue. Populated only when the session was queued; otherwise `null`.
                    example: null
              examples:
                processing:
                  summary: Continuation enqueued and processing
                  value:
                    session:
                      id: "sess_xYz789AbCd"
                      agent_id: "abc123DEFghiJKL"
                      messages:
                        - id: "msg_a1b2c3"
                          role: "user"
                          content: "Research Acme Corp and draft a brief."
                          created_at: "2026-05-15T14:32:00Z"
                          creator_id: "user_2b9d71f0"
                          parts: null
                        - id: "msg_d4e5f6"
                          role: "assistant"
                          content: "Here is what I found about Acme Corp..."
                          created_at: "2026-05-15T14:32:09Z"
                          creator_id: null
                          parts: null
                        - id: "msg_g7h8i9"
                          role: "user"
                          content: "Now write a follow-up email."
                          created_at: "2026-05-15T14:35:00Z"
                          creator_id: "user_2b9d71f0"
                          parts: null
                      created_at: "2026-05-15T14:32:00Z"
                      state: "processing"
                      agent_name: "Sales research agent"
                      agent_team_id: "team_4f8c92ab"
                      agent_creator_user_id: "user_2b9d71f0"
                      agent_icon_url: null
                      agent_tools: []
                      participants:
                        "user_2b9d71f0":
                          first_name: "Ada"
                          last_name: "Lovelace"
                      creator:
                        id: "user_2b9d71f0"
                        first_name: "Ada"
                        last_name: "Lovelace"
                        email: "ada@example.com"
                        profile_picture: null
                    queue_position: null
        '400':
          description: 'Bad request — missing `input`, or `stream: true` was set on this host (use the streaming host).'
        '401':
          description: Unauthorized — missing or invalid API key.
        '403':
          description: Forbidden — the caller does not have update access on the session.
        '404':
          description: Session not found.
        '409':
          description: Conflict — the session is not in a terminal state (`interaction_not_in_terminal_state`).
        '429':
          description: Rate limited — the agent's concurrency limit was exceeded.
        '500':
          description: Internal server error.
      security:
        - bearerAuth: []

  /sessions/{session_id}/cancel:
    post:
      summary: Cancel session
      description: |
        Cancel an in-progress session. If the session is currently `processing` or `queued`, any running stream is aborted and the session is transitioned to `failed`. If the session is already `completed` or `failed`, its current state is returned unchanged.

        The response carries a `session` envelope but only `id`, `agent_id`, and `state` are populated.
      operationId: cancelSession
      tags:
        - Sessions
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl -X POST 'https://api.gumloop.com/api/v1/sessions/sess_xYz789AbCd/cancel' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN'
        - lang: python
          label: Python
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            response = client.sessions.cancel("sess_xYz789AbCd")
            print(response.session.state)
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
          description: ID of the session to cancel.
      responses:
        '200':
          description: Session state after the cancel attempt. Only `id`, `agent_id`, and `state` are populated on the session envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "sess_xYz789AbCd"
                      agent_id:
                        type: string
                        example: "abc123DEFghiJKL"
                      messages:
                        type: array
                        items:
                          type: object
                      created_at:
                        type: string
                        format: date-time
                        nullable: true
                        example: null
                      state:
                        type: string
                        nullable: true
                        enum: [processing, completed, failed, queued, idle]
                        example: "failed"
                      agent_name:
                        type: string
                        nullable: true
                        example: null
                      agent_team_id:
                        type: string
                        nullable: true
                        example: null
                      agent_creator_user_id:
                        type: string
                        nullable: true
                        example: null
                      agent_icon_url:
                        type: string
                        nullable: true
                        example: null
                      agent_tools:
                        type: array
                        items:
                          type: object
                      participants:
                        type: object
                      creator:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: string
                            nullable: true
                          first_name:
                            type: string
                            nullable: true
                          last_name:
                            type: string
                            nullable: true
                          email:
                            type: string
                            nullable: true
                          profile_picture:
                            type: string
                            nullable: true
                  queue_position:
                    type: integer
                    nullable: true
                    example: null
              examples:
                cancelled:
                  summary: Cancelled an in-progress session
                  value:
                    session:
                      id: "sess_xYz789AbCd"
                      agent_id: "abc123DEFghiJKL"
                      messages: []
                      created_at: null
                      state: "failed"
                      agent_name: null
                      agent_team_id: null
                      agent_creator_user_id: null
                      agent_icon_url: null
                      agent_tools: []
                      participants: {}
                      creator: null
                    queue_position: null
                already_completed:
                  summary: Already in a terminal state — current state returned
                  value:
                    session:
                      id: "sess_xYz789AbCd"
                      agent_id: "abc123DEFghiJKL"
                      messages: []
                      created_at: null
                      state: "completed"
                      agent_name: null
                      agent_team_id: null
                      agent_creator_user_id: null
                      agent_icon_url: null
                      agent_tools: []
                      participants: {}
                      creator: null
                    queue_position: null
        '401':
          description: Unauthorized — missing or invalid API key.
        '403':
          description: Forbidden — the caller does not have update access on the session.
        '404':
          description: Session not found.
        '500':
          description: Internal server error — the abort could not be persisted (`failed_to_abort`).
      security:
        - bearerAuth: []
  /mcp/servers:
    get:
      summary: List MCP servers
      description: Return the catalog of MCP servers visible to the caller — Gumloop-hosted (`gumcp_server`), user-deployed Gumstack (`gumstack_server`), and custom (`mcp_server`) — along with each server's connection state.
      operationId: listMcpServers
      tags:
        - MCP
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl 'https://api.gumloop.com/api/v1/mcp/servers?team_id=YOUR_TEAM_ID' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN'
        - lang: python
          label: Python
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            response = client.mcp.list_servers(team_id="YOUR_TEAM_ID")
            for server in response.servers:
                print(server.server_id, server.status)
      parameters:
        - in: query
          name: team_id
          required: false
          schema:
            type: string
          description: Scope the catalog to a single team. When omitted, returns servers visible to the authenticated user.
      responses:
        '200':
          description: MCP servers visible to the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      type: object
                      required:
                        - server_id
                        - type
                        - status
                        - gumloop_auth_url
                      properties:
                        server_id:
                          type: string
                          description: Stable identifier for the server.
                          example: "gumloop_slack"
                        name:
                          type: string
                          nullable: true
                          example: "Slack"
                        type:
                          type: string
                          description: One of `gumcp_server`, `gumstack_server`, or `mcp_server`.
                          example: "gumcp_server"
                        status:
                          type: string
                          description: Connection state. `connected` means the server is ready to accept tool calls; other values (for example `unauthenticated`, `blocked`) indicate the user must complete OAuth or the server is otherwise unavailable.
                          example: "connected"
                        icon_url:
                          type: string
                          nullable: true
                          example: "https://www.gumloop.com/icons/slack.png"
                        description:
                          type: string
                          nullable: true
                          example: "Send and read Slack messages."
                        gumloop_auth_url:
                          type: string
                          description: URL the user should visit to connect or reauthorize this server.
                          example: "https://www.gumloop.com/oauth/connect/slack"
                        mcp_url:
                          type: string
                          nullable: true
                          description: For `mcp_server` (custom) and `gumstack_server` entries, the upstream MCP URL. `null` for Gumloop-hosted servers.
                          example: null
                        tool_count:
                          type: integer
                          nullable: true
                          example: 12
                        allowed_tool_call_ids:
                          type: array
                          nullable: true
                          description: Populated only by the retrieve endpoint. Always `null` here.
                          items:
                            type: string
                          example: null
              examples:
                multiple:
                  summary: Mixed connection states
                  value:
                    servers:
                      - server_id: "gumloop_slack"
                        name: "Slack"
                        type: "gumcp_server"
                        status: "connected"
                        icon_url: "https://www.gumloop.com/icons/slack.png"
                        description: "Send and read Slack messages."
                        gumloop_auth_url: "https://www.gumloop.com/oauth/connect/slack"
                        mcp_url: null
                        tool_count: 12
                        allowed_tool_call_ids: null
                      - server_id: "gumloop_linear"
                        name: "Linear"
                        type: "gumcp_server"
                        status: "unauthenticated"
                        icon_url: "https://www.gumloop.com/icons/linear.png"
                        description: "Read and create Linear issues."
                        gumloop_auth_url: "https://www.gumloop.com/oauth/connect/linear"
                        mcp_url: null
                        tool_count: 8
                        allowed_tool_call_ids: null
        '401':
          description: Unauthorized — missing or invalid API key.
        '403':
          description: Forbidden — the caller does not have agent access on the requested team.
        '500':
          description: Internal server error.
      security:
        - bearerAuth: []

