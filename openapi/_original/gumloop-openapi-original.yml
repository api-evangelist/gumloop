  /agents/{agent_id}/evaluations:
    get:
      summary: List evaluations
      description: |
        Returns a cursor-paginated list of evaluation results for a specific agent, newest first.
        Only completed and failed evaluations are returned (transient states like queued/in_progress are excluded).

        Each evaluation includes the grade, criteria pass/fail results, extracted data points, applied tags, and sentiment analysis.
      operationId: listEvaluations
      tags:
        - Evaluations
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl 'https://api.gumloop.com/api/v1/agents/AGENT_ID/evaluations?page_size=20' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN'
        - lang: python
          label: Python
          source: |
            import requests

            response = requests.get(
                "https://api.gumloop.com/api/v1/agents/AGENT_ID/evaluations",
                headers={"Authorization": "Bearer YOUR_ACCESS_TOKEN"},
                params={"page_size": 20}
            )
            data = response.json()
            for evaluation in data["evaluations"]:
                print(evaluation["grade"], evaluation["data_results"])
      parameters:
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
          description: ID of the agent whose evaluations to list.
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of evaluations to return per page (1-100).
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Pagination cursor from a previous response's `next_cursor` field.
        - in: query
          name: grade
          required: false
          schema:
            type: string
            enum: [pass, needs_review, needs_attention]
          description: Filter evaluations by grade.
      responses:
        '200':
          description: Paginated list of evaluation results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluations:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluationResult'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Pass this value as the `cursor` query parameter to fetch the next page. Null when there are no more results.
              example:
                evaluations:
                  - evaluation_id: "eval_abc123"
                    interaction_id: "int_xyz789"
                    agent_id: "agent_456"
                    created_ts: "2026-06-15T14:30:00+00:00"
                    status: "completed"
                    grade: "pass"
                    call_successful: "success"
                    sentiment: "positive"
                    summary: "User asked about pricing and the agent provided accurate tier information."
                    criteria_results:
                      - id: "crit_1"
                        name: "Accuracy"
                        type: "other"
                        priority: "needs_attention"
                        result: "success"
                        rationale: "All pricing information matched the current rate card."
                      - id: "crit_2"
                        name: "Stayed on Topic"
                        type: "voice_tone"
                        priority: "needs_review"
