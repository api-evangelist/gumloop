          label: cURL
          source: |
            curl 'https://api.gumloop.com/api/v1/agents/abc123DEFghiJKL/sessions?page_size=20' \
              -H 'Authorization: Bearer YOUR_ACCESS_TOKEN'
        - lang: python
          label: Python
          source: |
            from gumloop import Gumloop

            client = Gumloop(access_token="YOUR_ACCESS_TOKEN")

            response = client.sessions.list("abc123DEFghiJKL")
            for session in response.sessions:
                print(session.id, session.state)
      parameters:
        - in: path
          name: agent_id
          required: true
          schema:
            type: string
          description: ID of the agent whose sessions to list.
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of sessions to return per page. Defaults to `20`, maximum `100`.
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Cursor for the next page of results. Use the `next_cursor` value from a previous response.
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Free-text search query to filter sessions by name or content. Also accepted as `search_query`.
        - in: query
          name: sort_order
