                      - id: "dp_2"
                        name: "Confidence Score"
                        data_type: "number"
                        value: 8.5
                    applied_tags:
                      - "PRICING_INQUIRY"
                      - "POSITIVE_FEEDBACK"
                next_cursor: "eyJjcmVhdGVkX3RzIjoiMjAyNi0wNi0xNVQxNDozMDowMCswMDowMCJ9"
        '400':
