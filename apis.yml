aid: gumloop
name: Gumloop
description: >-
  Gumloop is an AI-agent automation platform for building, deploying, and governing
  agents that automate real work — data analysis, customer support, CRM management,
  and back-office tasks — across tools like Slack, Microsoft Teams, and Gmail. Its
  public REST API (https://api.gumloop.com/api/v1) exposes 49 operations spanning
  flow execution, agents and sessions, an OpenAI-compatible chat/completions endpoint,
  Company Brain search, agent skills, artifacts, MCP server management, evaluations,
  file handling, teams, and organization administration. Gumloop ships first-party
  Python and JavaScript SDKs, a `gumloop` CLI, a hosted MCP server for Claude/Cursor/
  VS Code, OAuth 2.0 with PKCE, webhook/schedule/event triggers, and enterprise
  controls (SSO/SAML/SCIM, audit logging, app policies).
